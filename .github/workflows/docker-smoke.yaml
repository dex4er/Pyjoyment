name: Docker Smoke Test

# Builds and runs the images of "generate dockerfile" for an application, a
# Lite script with pyproject.toml and a Lite script with the inline metadata
# of PEP 723, with the wheel of the checkout, and checks that they serve the
# generated pages and stop gracefully, and runs a Lite script as an event
# function in the image of AWS Lambda for Python, also streaming its responses
# with the runtime client of Pyjoyment, and a Lite script that speaks FastCGI
# to Caddy in front of it. The weekly run catches a change of
# the images of Python, uv, AWS Lambda and Caddy.
on:
  push:
    branches:
      - main
    paths:
      - tt/docker-smoke/**
      - .github/workflows/docker-smoke.yaml
      - examples/lambda_stream/wrapper.sh
      - Pyjo/**
      - Pyjoyment/**
      - mise.lock
      - mise.toml
      - pyproject.toml
  pull_request:
    branches:
      - "*"
    paths:
      - tt/docker-smoke/**
      - .github/workflows/docker-smoke.yaml
      - examples/lambda_stream/wrapper.sh
      - Pyjo/**
      - Pyjoyment/**
      - mise.lock
      - mise.toml
      - pyproject.toml
  schedule:
    - cron: 37 5 * * 1
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.variant }})

    strategy:
      fail-fast: false
      matrix:
        variant:
          - app
          - lite
          - lite-pep723
          - lambda
          - lambda-stream
          - fastcgi

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.4 # datasource=github-releases depName=jdx/mise

      - name: Run smoke test
        env:
          VARIANT: ${{ matrix.variant }}
        run: tt/docker-smoke/smoke.sh "${VARIANT}"
