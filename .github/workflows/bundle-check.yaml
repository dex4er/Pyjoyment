name: Bundle Check

# The JavaScript libraries of the bundled templates are copied from the
# packages of npm that package.json names, by `npm run bundle`. Renovate bumps
# package.json and package-lock.json, but cannot copy the files, so on its
# branches the update job below commits them; anywhere else, files that do not
# match the lock fail the check.
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/bundle-check.yaml
      - package-lock.json
      - package.json
      - Pyjoyment/resources/public/pyjo/bootstrap/**
      - Pyjoyment/resources/public/pyjo/highlight.js/**
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Check the bundled files

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    outputs:
      stale: ${{ steps.up_to_date.outputs.stale }}

    env:
      # Only branches of this repository qualify, never a fork's.
      RENOVATE_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/')
        && github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      # A Renovate branch is checked out at its head rather than merged with
      # main, so that the copied files match the branch they are committed
      # to.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RENOVATE_PR == 'true' && github.event.pull_request.head.sha || '' }}

      - name: Install Node from mise.lock
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.4 # datasource=github-releases depName=jdx/mise
          install_args: node

      # npm ci checks every package against its integrity in package-lock.json.
      # No script of the packages runs.
      - name: Install the packages
        run: npm ci --ignore-scripts

      - name: Copy the bundled files
        run: npm run bundle

      - name: Check the bundled files are up to date
        id: up_to_date
        run: |-
          git add --all Pyjoyment/resources/public/pyjo

          if git diff --cached --exit-code --stat; then
            echo "The bundled files are up to date."
            exit 0
          fi

          if [ "$RENOVATE_PR" = 'true' ]; then
            git diff --cached --binary > bundle.patch
            echo "stale=true" | tee -a "$GITHUB_OUTPUT"
            echo "::notice::The bundled files are out of date on a Renovate branch; the update job commits them."
            exit 0
          fi

          echo "::error::The bundled files do not match package-lock.json. Run \`npm ci --ignore-scripts && npm run bundle\` and commit the result." >&2
          exit 1

      - name: Upload the patch
        if: steps.up_to_date.outputs.stale == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bundle-patch
          path: bundle.patch
          retention-days: 1

  # Commits the files that the check job copied onto the Renovate branch, with
  # the token of the workflow. A push with it starts no workflow, so the job
  # starts the checks of the commit itself, as workflow_dispatch is the event
  # that the token can start; this check among them, which fails if the files
  # are still out of date, as it does not commit on such a run. The job runs no
  # code of the packages: it only applies the patch.
  update:
    name: Commit the bundled files

    needs: check
    if: needs.check.outputs.stale == 'true'

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download the patch
        uses: actions/download-artifact@v8
        with:
          name: bundle-patch

      # The author is in gitIgnoredAuthors of .renovaterc.json, so that
      # Renovate keeps rebasing and updating the branch. The push goes to the
      # commit that the check job copied the files for: if the branch moved
      # meanwhile, the push is rejected, and the run of the newer commit takes
      # over.
      - name: Commit and push to the pull request branch
        env:
          BRANCH: ${{ github.head_ref }}
          MESSAGE: Copy the bundled files of package-lock.json
        run: |-
          git apply --index bundle.patch
          rm bundle.patch
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "$MESSAGE"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Run the checks of the commit
        env:
          BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          gh workflow run bundle-check.yaml --ref "$BRANCH"
          gh workflow run build.yaml --ref "$BRANCH"
          gh workflow run tests.yaml --ref "$BRANCH"
          gh workflow run trunk-check.yaml --ref "$BRANCH"
