name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "*"
  schedule:
    # Weekly run catches breakage from new Python releases even when the code
    # did not change.
    - cron: 17 5 * * 1
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  prove:
    name: prove (python ${{ matrix.python }})

    strategy:
      fail-fast: false
      matrix:
        # "mise" is the version pinned in mise.toml and verified against
        # mise.lock; the other entries come from setup-python. PyPy is
        # supported on a best-effort basis.
        python:
          - mise
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
          - pypy3.12

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        if: matrix.python == 'mise'
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.4 # datasource=github-releases depName=jdx/mise

      - name: Set up Python
        if: matrix.python != 'mise'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      # Invalid escape sequences and deprecated APIs become errors in a future
      # Python; fail now instead. Only the tests: setup-python runs pip, whose
      # warnings are not ours. The development mode of Python shows the
      # ResourceWarning of a socket or a file that is not closed, which only
      # goes to the standard error, so the output is checked for it. The tests
      # that request remote hosts, which are those of GitHub, run on the Python
      # of mise.toml only.
      - name: Run tests
        shell: bash
        env:
          PYTHONDEVMODE: "1"
          PYTHONWARNINGS: error::SyntaxWarning,error::DeprecationWarning
          TEST_ONLINE: ${{ matrix.python == 'mise' && '1' || '' }}
        run: |
          python --version
          python -m Pyjo.Prove -l --color -j 4 --timeout 60 --capture-stderr --stderr-lines 1000 -r t 2>&1 | tee prove.log
          if grep -n 'ResourceWarning:' prove.log; then exit 1; fi

      # The tests of the event loop, and of the user agent, the WebSockets and
      # the servers, which do the most of its I/O, run on the reactor without
      # asyncio too, with the tests that request remote hosts.
      - name: Run tests on Pyjo.Reactor.Poll
        shell: bash
        env:
          PYJO_REACTOR: Pyjo.Reactor.Poll
          PYTHONDEVMODE: "1"
          PYTHONWARNINGS: error::SyntaxWarning,error::DeprecationWarning
          TEST_ONLINE: ${{ matrix.python == 'mise' && '1' || '' }}
        run: |
          python -m Pyjo.Prove -l --color -j 4 --timeout 60 --capture-stderr --stderr-lines 1000 \
            t/Pyjo/IOLoop*.py t/Pyjo/TLS.py t/Pyjo/Promise*.py t/Pyjo/Subprocess.py t/stdlib/IOLoop*.py \
            t/Pyjo/UserAgent*.py t/stdlib/UserAgent*.py t/Pyjo/WebSocket*.py t/Pyjo/Server_Daemon*.py t/stdlib/Server_Daemon.py \
            t/Pyjo/Server_Hot.py t/stdlib/Server_Hot.py t/Pyjo/Server_Prefork.py t/stdlib/Server_Prefork.py \
            t/Pyjo/Server_Reload.py t/stdlib/Server_Reload.py t/Pyjo/File_download.py 2>&1 | tee prove.log
          if grep -n 'ResourceWarning:' prove.log; then exit 1; fi

      # The tests of Pyjo.Server.ASGI, Pyjo.Server.WSGI and Pyjo.Server.CGI with
      # real servers, from the dependency group "servers", on the Python of
      # mise.toml only.
      - name: Run tests on ASGI, WSGI and CGI servers
        if: matrix.python == 'mise'
        shell: bash
        env:
          PYTHONDEVMODE: "1"
          PYTHONWARNINGS: error::SyntaxWarning,error::DeprecationWarning
        run: |
          uv run --python "$(command -v python)" --only-group servers python -m Pyjo.Prove -l --color --timeout 120 -r t/servers 2>&1 | tee prove.log
          if grep -n 'ResourceWarning:' prove.log; then exit 1; fi

      # The same on Python 3.14, which uv downloads, as it still has the CGI
      # server of http.server, which Python 3.15 removed.
      - name: Run tests on ASGI, WSGI and CGI servers on Python 3.14
        if: matrix.python == 'mise'
        shell: bash
        env:
          PYTHONDEVMODE: "1"
          PYTHONWARNINGS: error::SyntaxWarning,error::DeprecationWarning
          UV_PROJECT_ENVIRONMENT: .venv-3.14
        run: |
          uv run --python 3.14 --only-group servers python -m Pyjo.Prove -l --color --timeout 120 -r t/servers 2>&1 | tee prove.log
          if grep -n 'ResourceWarning:' prove.log; then exit 1; fi

  docs:
    name: docs

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.4 # datasource=github-releases depName=jdx/mise

      # The documentation of Read the Docs, with its docs/requirements.txt: a
      # warning of Sphinx, as a reference that is not found or a docstring that
      # is not valid reStructuredText, fails the build.
      - name: Build documentation
        run: |-
          uv run --with-requirements docs/requirements.txt \
            sphinx-build -W --keep-going -b html docs docs/_build/html

  build:
    name: build

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.4 # datasource=github-releases depName=jdx/mise

      # uv.lock has to match pyproject.toml.
      - name: Check uv.lock
        run: uv lock --check

      - name: Build sdist and wheel
        run: uv build

      # Package data is the easiest part of a package to lose silently.
      - name: Check wheel contents
        run: |-
          python -m zipfile -l dist/*.whl | tee wheel.txt
          grep -q 'Pyjo/IOLoop/certs/server.crt' wheel.txt
          grep -q 'Pyjo/IOLoop/certs/server.key' wheel.txt
          grep -q 'Pyjoyment/__init__.py' wheel.txt
          grep -q 'Pyjoyment/resources/public/favicon.ico' wheel.txt
          grep -q 'Pyjoyment/resources/public/pyjo/logo.png' wheel.txt
          grep -q 'Pyjoyment/resources/public/pyjo/bootstrap/bootstrap.css' wheel.txt
          grep -q 'Pyjoyment/resources/templates/pyjo/debug.html.ep' wheel.txt
          grep -q 'Pyjo/py.typed' wheel.txt
