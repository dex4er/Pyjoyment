name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "*"
  schedule:
    # Weekly run catches breakage from new Python releases even when the code
    # did not change.
    - cron: 17 5 * * 1
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # The version pinned in mise.toml and verified against mise.lock. Each version
  # runs the tests on the reactor of asyncio, the default, and on the reactor
  # without asyncio, as a reactor has to pass them all, with the tests that
  # request remote hosts, which are those of GitHub.
  prove-mise:
    name: prove (python mise, ${{ matrix.reactor }})

    strategy:
      fail-fast: false
      matrix:
        reactor:
          - Asyncio
          - Poll

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.4 # datasource=github-releases depName=jdx/mise

      # Invalid escape sequences and deprecated APIs become errors in a future
      # Python; fail now instead. The development mode of Python shows the
      # ResourceWarning of a socket or a file that is not closed, which only
      # goes to the standard error, so the output is checked for it.
      - name: Run tests
        shell: bash
        env:
          PYJO_REACTOR: Pyjo.Reactor.${{ matrix.reactor }}
          PYTHONDEVMODE: "1"
          PYTHONWARNINGS: error::SyntaxWarning,error::DeprecationWarning
          TEST_ONLINE: "1"
        run: |
          python --version
          python -m Pyjo.Prove -l --color -j 4 --timeout 60 --capture-stderr --stderr-lines 1000 -r t 2>&1 | tee prove.log
          if grep -n 'ResourceWarning:' prove.log; then exit 1; fi

  # Windows, with the version of mise.toml, on both reactors, as above: the
  # reactor without asyncio uses select.select there, in the place of
  # select.poll.
  prove-windows:
    name: prove (python mise, ${{ matrix.reactor }}, Windows)

    strategy:
      fail-fast: false
      matrix:
        reactor:
          - Asyncio
          - Poll

    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.4 # datasource=github-releases depName=jdx/mise

      # As above.
      - name: Run tests
        shell: bash
        env:
          PYJO_REACTOR: Pyjo.Reactor.${{ matrix.reactor }}
          PYTHONDEVMODE: "1"
          PYTHONWARNINGS: error::SyntaxWarning,error::DeprecationWarning
          TEST_ONLINE: "1"
        run: |
          python --version
          python -m Pyjo.Prove -l --color -j 4 --timeout 60 --capture-stderr --stderr-lines 1000 -r t 2>&1 | tee prove.log
          if grep -n 'ResourceWarning:' prove.log; then exit 1; fi

  # The other supported versions, from setup-python. PyPy is supported on a
  # best-effort basis.
  prove:
    name: prove (python ${{ matrix.python }}, ${{ matrix.reactor }})

    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
          - 3.15t
          - pypy3.12
        reactor:
          - Asyncio
          - Poll

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      # As above. Only the tests: setup-python runs pip, whose warnings are not
      # ours.
      - name: Run tests
        shell: bash
        env:
          PYJO_REACTOR: Pyjo.Reactor.${{ matrix.reactor }}
          PYTHONDEVMODE: "1"
          PYTHONWARNINGS: error::SyntaxWarning,error::DeprecationWarning
          TEST_ONLINE: "1"
        run: |-
          python --version
          python -m Pyjo.Prove -l --color -j 4 --timeout 60 --capture-stderr --stderr-lines 1000 -r t 2>&1 | tee prove.log
          if grep -n 'ResourceWarning:' prove.log; then exit 1; fi

  # The tests of Pyjo.Server.ASGI, Pyjo.Server.WSGI and Pyjo.Server.CGI with
  # real servers, from the dependency group "servers", which uv installs, on
  # the oldest and the newest supported Python; Python 3.12 runs the CGI server
  # of http.server too, which Python 3.15 removed.
  servers:
    name: servers (python ${{ matrix.python }})

    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.12"
          - "3.15"

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.0 # datasource=github-releases depName=astral-sh/uv

      - name: Run tests on ASGI, WSGI and CGI servers
        shell: bash
        env:
          PYTHONDEVMODE: "1"
          PYTHONWARNINGS: error::SyntaxWarning,error::DeprecationWarning
        run: |-
          uv run --python "$(command -v python)" --only-group servers python -m Pyjo.Prove -l --color --timeout 120 -r t/servers 2>&1 | tee prove.log
          if grep -n 'ResourceWarning:' prove.log; then exit 1; fi

  # The plugin of pytest, with pytest of the dependency group "pytest", which uv
  # installs with the project, so that pytest loads the plugin of its entry
  # point: the tests of the plugin, and all the test scripts run by pytest, on
  # the oldest and the newest supported Python, and on Windows.
  pytest:
    name: pytest (python ${{ matrix.python }}, ${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            python: "3.12"
          - os: ubuntu-24.04-arm
            python: "3.15"
          - os: windows-latest
            python: "3.15"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.0 # datasource=github-releases depName=astral-sh/uv

      - name: Run tests of the plugin of pytest
        shell: bash
        env:
          PYTHONDEVMODE: "1"
          PYTHONWARNINGS: error::SyntaxWarning,error::DeprecationWarning
        run: |-
          uv run --python "${{ matrix.python }}" --group pytest python -m Pyjo.Prove -l --color --timeout 120 --capture-stderr t/Pyjo/Test_pytest_plugin.py t/docs/Test_pytest_plugin.py t/docs/guides_testing.py 2>&1 | tee prove.log
          if grep -n 'ResourceWarning:' prove.log; then exit 1; fi

      # pytest shows the standard error of a test script that failed only, so
      # the ResourceWarning of the scripts is checked by the jobs of prove;
      # pytest-xdist runs four test scripts at the same time, as -j 4 of prove,
      # and with -v writes a line of the path alone when a script starts, before
      # the line of its result, which grep leaves out, with the CR of the CRLF
      # that Python writes to a pipe on Windows
      - name: Run all tests with pytest
        shell: bash
        env:
          PYTHONWARNINGS: error::SyntaxWarning,error::DeprecationWarning
          TEST_ONLINE: "1"
        run: |-
          uv run --python "${{ matrix.python }}" --group pytest pytest -p no:cacheprovider --color=yes -v -n 4 -o pyjo_prove_timeout=60 | grep -Ev '^t[/\\][^ ]* [[:cntrl:]]?$'
