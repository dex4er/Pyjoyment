name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "*"
  schedule:
    # Weekly run catches breakage from new Python releases even when the code
    # did not change.
    - cron: 17 5 * * 1
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  prove:
    name: prove (python ${{ matrix.python }})

    strategy:
      fail-fast: false
      matrix:
        # "mise" is the version pinned in mise.toml and verified against
        # mise.lock; the other entries come from setup-python. PyPy is
        # supported on a best-effort basis.
        python:
          - mise
          - "3.12"
          - "3.13"
          - "3.15"
          - pypy3.12

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    env:
      PYTHONPATH: .
      # Invalid escape sequences become errors in a future Python.
      PYTHONWARNINGS: error::SyntaxWarning

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        if: matrix.python == 'mise'
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.4 # datasource=github-releases depName=jdx/mise

      - name: Set up Python
        if: matrix.python != 'mise'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Run tests
        run: |
          python --version
          python -m Pyjo.Prove -j 4 t/Pyjo t/docs t/examples

  build:
    name: build

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.4 # datasource=github-releases depName=jdx/mise

      - name: Build sdist and wheel
        run: uv build

      # Package data is the easiest part of a package to lose silently.
      - name: Check wheel contents
        run: |
          python -m zipfile -l dist/*.whl | tee wheel.txt
          grep -q 'Pyjo/IOLoop/certs/server.crt' wheel.txt
          grep -q 'Pyjo/IOLoop/certs/server.key' wheel.txt
          grep -q 'Pyjoyment/__init__.py' wheel.txt
          grep -q 'Pyjo/py.typed' wheel.txt
