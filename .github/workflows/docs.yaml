name: Docs

# Builds the documentation with the Sphinx of docs/requirements.txt, as Read
# the Docs does, from the pages of docs, the docstrings of the modules and the
# examples that the pages include: a warning of Sphinx, as a
# reference that is not found or a docstring that is not valid
# reStructuredText, fails the build.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs.yaml
      - docs/**
      - examples/**
      - Pyjo/**
      - Pyjoyment/**
      - mise.lock
      - mise.toml
      - pyproject.toml
  pull_request:
    branches:
      - "*"
    paths:
      - .github/workflows/docs.yaml
      - docs/**
      - examples/**
      - Pyjo/**
      - Pyjoyment/**
      - mise.lock
      - mise.toml
      - pyproject.toml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: build

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.4 # datasource=github-releases depName=jdx/mise

      # --keep-going reports all the warnings, which -W turns into errors.
      - name: Build documentation
        run: |-
          uv run --with-requirements docs/requirements.txt \
            sphinx-build -W --keep-going -b html docs docs/_build/html
