# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@24.21.0
    - python@3.14.4
# actionlint comes from the maintained fork of kjanat, which continues the
# releases of rhysd/actionlint after 1.7.12 with the same names of the files,
# where the plugin downloads them from rhysd/actionlint.
downloads:
  - name: actionlint
    downloads:
      - os:
          linux: linux
          macos: darwin
        cpu:
          x86_64: amd64
          arm_64: arm64
        url: https://github.com/kjanat/actionlint/releases/download/v${version}/actionlint_${version}_${os}_${cpu}.tar.gz
      - os: windows
        cpu:
          x86_64: amd64
          arm_64: arm64
        url: https://github.com/kjanat/actionlint/releases/download/v${version}/actionlint_${version}_windows_${cpu}.zip
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    # shfmt ignores .editorconfig when it is given any formatting flag, and
    # the plugin passes `-s`, so it would indent with tabs regardless of
    # indent_style. Run it without flags; `simplify = true` in .editorconfig
    # keeps the simplification.
    - name: shfmt
      commands:
        - name: format
          output: shfmt
          run: shfmt -w ${target}
          success_codes: [0, 1]
          cache_results: true
          formatter: true
          batch: true
          in_place: true
    # Biome formats and lints CSS, HTML, JavaScript, JSON, Markdown and YAML,
    # with biome.jsonc. parse_regex is matched against the whole output of a
    # batch, so `^` needs `(?m)` to match at every line; without it Trunk
    # reports only the first issue that Biome prints. Trunk runs Biome on a copy
    # of the files in a sandbox outside the repository, with a copy of
    # biome.jsonc of direct_configs, not --config-path of the one of the
    # repository, as Biome takes the options of its parser, as the front matter
    # of Markdown, only for the files under the directory of its
    # configuration. The sandbox has no .gitignore, which vcs.useIgnoreFile
    # reads, so the commands turn it off, as Trunk applies .gitignore itself,
    # and --no-errors-on-unmatched passes a file that biome.jsonc leaves out.
    - name: biome
      direct_configs:
        - biome.jsonc
      files:
        - css
        - html
        - javascript
        - json
        - markdown
        - yaml
      commands:
        - output: regex
          success_codes:
            - 0
            - 1
          batch: true
          cache_results: false
          name: lint
          parse_regex: (?m)^::(?P<severity>.*) title=(?P<code>[^,]+),file=(?P<path>[^,]+),line=(?P<line>[^,]+),endLine=[^,]+,col=(?P<col>[^,]+),endColumn=[^:]+::(?P<message>.*)
          read_output_from: stdout
          run: biome check --vcs-use-ignore-file=false --reporter=github --no-errors-on-unmatched ${target}
          run_from: ${root_or_parent_with(biome.jsonc)}
        - output: regex
          success_codes:
            - 0
          batch: true
          cache_results: false
          formatter: true
          name: fmt
          parse_regex: (?m)^::(?P<severity>.*) title=(?P<code>[^,]+),file=(?P<path>[^,]+),line=(?P<line>[^,]+),endLine=[^,]+,col=(?P<col>[^,]+),endColumn=[^:]+::(?P<message>.*)
          read_output_from: stdout
          run: biome format --vcs-use-ignore-file=false --reporter=github --write --no-errors-on-unmatched ${target}
          run_from: ${root_or_parent_with(biome.jsonc)}
      run_timeout: 1m
  enabled:
    - actionlint@1.17.0
    # The version of package.json, which Renovate bumps in both, and which the
    # ! keeps from trunk upgrade
    - biome@2.6.4! # datasource=npm depName=@biomejs/biome
    - git-diff-check
    - pyright@1.1.414
    # The format command of ruff is disabled in the plugin by default
    - ruff@0.17.2:
        commands:
          - lint
          - format
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - taplo@0.10.0
    # yamllint checks what Biome does not, as the duplicated keys and the
    # values that YAML 1.1 reads otherwise
    - yamllint@1.38.0
  disabled:
    # bandit: security checks for Python code; not used here
    - bandit
    # black: Python formatter; ruff formats the code
    - black
    # checkov: scanner for infrastructure as code; the only one is the OpenTofu
    # of an example, a platform of tests, not of production
    - checkov
    # grype: known vulnerabilities in images and dependencies; there are no
    # runtime dependencies, as for osv-scanner and trivy
    - grype
    # hadolint: lints Dockerfiles; the only one is used by a test in CI
    - hadolint
    # isort: sorts Python imports; ruff sorts them (rule I)
    - isort
    # markdownlint: lints Markdown; Biome formats it and has its rules that are
    # not about formatting
    - markdownlint
    # osv-scanner: known vulnerabilities in dependency lockfiles; there are no
    # runtime dependencies
    - osv-scanner
    # oxipng: optimizes PNG images; the images are renders of their SVG
    # sources, rendered again with rsvg-convert, not files to rewrite
    - oxipng
    # oxlint: JavaScript linter; the only JavaScript of the project is the
    # empty files of the tests, and the bundled libraries are left as they are
    - oxlint
    # pinact: pins GitHub Actions to commit hashes; Renovate keeps the actions
    # up to date by their tags
    - pinact
    # prettier: formats CSS, HTML, JavaScript, JSON, Markdown and YAML; Biome
    # formats them
    - prettier
    # renovate: validates the Renovate configuration; Renovate validates it
    # itself on every run, and the linter is a heavy npm package
    - renovate
    # svgo: optimizes SVG images; the SVG images are the sources of the
    # artwork, edited by hand
    - svgo
    # tflint: lints Terraform; the OpenTofu of the examples is checked with tofu
    # validate and tofu fmt, and the rules of AWS are a plugin that it downloads
    - tflint
    # trivy: scanner for containers, infrastructure as code and dependencies;
    # nothing to scan here, as for checkov
    - trivy
    # trufflehog: secret scanner; not needed here, and it would report the
    # default self-signed TLS key in Pyjo/IOLoop/certs, tracked on purpose
    - trufflehog
    # yamlfmt: formats YAML; Biome formats it
    - yamlfmt
  ignore:
    # Rewritten by trunk upgrade
    - linters:
        - biome
      paths:
        - .trunk/trunk.yaml
    # Libraries and stylesheets that Pyjoyment bundles as they are, from
    # their own projects or from Mojolicious, so that a newer version replaces
    # them without a diff of formatting, and the lock of npm, which npm writes
    - linters:
        - ALL
      paths:
        - package-lock.json
        - Pyjoyment/resources/public/pyjo/bootstrap/**
        - Pyjoyment/resources/public/pyjo/highlight.js/**
        - Pyjoyment/resources/public/pyjo/pyjo.css
    # Configuration files of the tests, which are templates of Pyjo.Template
    # before they are JSON, TOML or YAML, as those of Mojolicious
    - linters:
        - biome
        - taplo
        - yamllint
      paths:
        - t/Pyjoyment/json_config_lite_app.json
        - t/Pyjoyment/toml_config_lite_app.toml
        - t/Pyjoyment/yaml_config_lite_app*.yml
    # Benchmarks, examples and tests that need other libraries, which are not
    # installed for the project, as the servers of the dependency group
    # "servers" and pytest of "pytest"
    - linters:
        - pyright
      paths:
        - benchmarks/**
        - examples/aws/s3.py
        - examples/mount/hello_mangum.py
        - examples/mount/mount_mcp.py
        - examples/pyjo/resolv_dns.py
        - examples/servers/hello_world_uvicorn.py
        - examples/servers/hello_world_werkzeug.py
        - examples/servers/server_asgi_on_request.py
        - Pyjo/Test/pytest_plugin.py
        - t/lib/ServerProcess.py
        - t/servers/**
actions:
  enabled:
    - git-blame-ignore-revs
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
