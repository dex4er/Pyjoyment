# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@24.21.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    # shfmt ignores .editorconfig when it is given any formatting flag, and
    # the plugin passes `-s`, so it would indent with tabs regardless of
    # indent_style. Run it without flags; `simplify = true` in .editorconfig
    # keeps the simplification.
    - name: shfmt
      commands:
        - name: format
          output: shfmt
          run: shfmt -w ${target}
          success_codes: [0, 1]
          cache_results: true
          formatter: true
          batch: true
          in_place: true
  enabled:
    - actionlint@1.7.12
    - git-diff-check
    - markdownlint@0.49.1
    - prettier@3.9.10
    - pyright@1.1.414
    # The format command of ruff is disabled in the plugin by default
    - ruff@0.17.1:
        commands:
          - lint
          - format
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - taplo@0.10.0
    - yamlfmt@0.21.0
    - yamllint@1.38.0
  disabled:
    # bandit: security checks for Python code; not used here
    - bandit
    # black: Python formatter; ruff formats the code
    - black
    # checkov: scanner for infrastructure as code; there is none here
    - checkov
    # grype: known vulnerabilities in images and dependencies; there are no
    # runtime dependencies, as for osv-scanner and trivy
    - grype
    # hadolint: lints Dockerfiles; the only one is used by a test in CI
    - hadolint
    # isort: sorts Python imports; ruff sorts them (rule I)
    - isort
    # osv-scanner: known vulnerabilities in dependency lockfiles; there are no
    # runtime dependencies
    - osv-scanner
    # oxipng: optimizes PNG images; the images are renders of their SVG
    # sources, rendered again with rsvg-convert, not files to rewrite
    - oxipng
    # oxlint: JavaScript linter; the only JavaScript of the project is the
    # empty files of the tests, and the bundled libraries are left as they are
    - oxlint
    # pinact: pins GitHub Actions to commit hashes; Renovate keeps the actions
    # up to date by their tags
    - pinact
    # renovate: validates the Renovate configuration; Renovate validates it
    # itself on every run, and the linter is a heavy npm package
    - renovate
    # svgo: optimizes SVG images; the SVG images are the sources of the
    # artwork, edited by hand
    - svgo
    # trivy: scanner for containers, infrastructure as code and dependencies;
    # nothing to scan here
    - trivy
    # trufflehog: secret scanner; not needed here, and it would report the
    # default self-signed TLS key in Pyjo/IOLoop/certs, tracked on purpose
    - trufflehog
  ignore:
    # Rewritten by trunk upgrade
    - linters:
        - yamlfmt
      paths:
        - .trunk/trunk.yaml
    # Libraries and stylesheets that Pyjoyment bundles as they are, from
    # their own projects or from Mojolicious, so that a newer version replaces
    # them without a diff of formatting, and the lock of npm, which npm writes
    - linters:
        - ALL
      paths:
        - package-lock.json
        - Pyjoyment/resources/public/pyjo/bootstrap/**
        - Pyjoyment/resources/public/pyjo/highlight.js/**
        - Pyjoyment/resources/public/pyjo/pyjo.css
    # Configuration files of the tests, which are templates of Pyjo.Template
    # before they are JSON, TOML or YAML, as those of Mojolicious
    - linters:
        - prettier
        - taplo
        - yamlfmt
        - yamllint
      paths:
        - t/Pyjoyment/json_config_lite_app.json
        - t/Pyjoyment/toml_config_lite_app.toml
        - t/Pyjoyment/yaml_config_lite_app*.yml
    # Benchmarks, examples and tests that need other libraries, which are not
    # installed for the project, as the servers of the dependency group
    # "servers"
    - linters:
        - pyright
      paths:
        - benchmarks/**
        - examples/resolv_dns.py
        - examples/hello_world_uvicorn.py
        - examples/hello_world_werkzeug.py
        - examples/server_asgi_on_request.py
        - t/lib/ServerProcess.py
        - t/servers/**
actions:
  enabled:
    - git-blame-ignore-revs
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
