[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "Pyjoyment"
version = "0.0.2"
description = "A real-time web framework for the Python programming language, ported from Mojolicious."
readme = "README.rst"
license = "Artistic-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Piotr Roszatycki", email = "piotr.roszatycki@gmail.com" }]
requires-python = ">=3.12"
dependencies = []
keywords = [
  "async",
  "framework",
  "html",
  "http",
  "mojo",
  "mojolicious",
  "pyjo",
  "pyjoyment",
  "tap",
  "test",
  "websocket",
  "wsgi",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Internet :: WWW/HTTP :: WSGI",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Server",
  "Topic :: Software Development :: Testing",
  "Topic :: Text Processing :: Markup :: HTML",
]

[project.scripts]
pyjo-prove = "Pyjo.Prove:main"

[project.urls]
Homepage = "https://github.com/dex4er/Pyjoyment"
Documentation = "https://pyjoyment.readthedocs.io/"
Source = "https://github.com/dex4er/Pyjoyment"
Issues = "https://github.com/dex4er/Pyjoyment/issues"

[tool.hatch.build.targets.wheel]
packages = ["Pyjo", "Pyjoyment"]

[tool.hatch.build.targets.sdist]
include = [
  "/Pyjo",
  "/Pyjoyment",
  "/t",
  "/examples",
  "/docs",
  "/.proverc",
  "/LICENSE",
  "/README.rst",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# An explicit list, because newer ruff enables many more rules by default,
# including N999, which rejects the Mojo-style module names on purpose.
select = ["B", "E4", "E7", "E9", "F", "I", "TID251", "UP"]
ignore = [
  # B018 "Found useless expression. Either assign it to a variable or remove
  # it.": reading an attribute for its side effect is intentional, to build a
  # lazy attribute or to raise ReferenceError for a dead weakref proxy.
  "B018",
  # E722 "Do not use bare `except`": ported from Perl's eval {}, which catches
  # everything; narrowing it to Exception changes behaviour.
  "E722",
  # E741 "Ambiguous variable name: `l`": names as in the Mojo code they were
  # ported from.
  "E741",
]

[tool.ruff.lint.per-file-ignores]
# Test scripts import all test functions, like `use Test::More` in Perl.
"t/**" = [
  # F403 "`from Pyjo.Test import *` used; unable to detect undefined names"
  "F403",
  # F405 "`ok` may be undefined, or defined from star imports"
  "F405",
  # TID251 "`asyncio` is banned: ...": the tests check how a reactor works
  # with asyncio.
  "TID251",
]
# TID251 "`asyncio` is banned: ...": the reactor is the one that uses the
# event loop, the test harness runs the scripts with asyncio, and the examples
# are the code of a user.
"Pyjo/Reactor/**" = ["TID251"]
"Pyjo/Prove.py" = ["TID251"]
"examples/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Only a reactor uses the event loop, so that another reactor can replace it.
"asyncio".msg = "only a reactor uses the event loop, use the methods of Pyjo.Reactor"


[tool.ruff.lint.isort]
# Pyjo modules first, then the standard library, like Mojo modules list Mojo::*
# before core modules; `import X` and `from X import y` in separate groups.
known-first-party = ["Pyjo", "Pyjoyment"]
section-order = [
  "future",
  "first-party",
  "local-folder",
  "standard-library",
  "third-party",
]
lines-between-types = 1
lines-after-imports = 2

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "off"
strict = [
  "Pyjo/Asset/__init__.py",
  "Pyjo/Asset/File.py",
  "Pyjo/Asset/Memory.py",
  "Pyjo/Cache.py",
  "Pyjo/Collection.py",
  "Pyjo/Cookie/__init__.py",
  "Pyjo/Cookie/Request.py",
  "Pyjo/Cookie/Response.py",
  "Pyjo/DOM/__init__.py",
  "Pyjo/DOM/CSS.py",
  "Pyjo/DOM/HTML.py",
  "Pyjo/Date.py",
  "Pyjo/EventEmitter.py",
  "Pyjo/Exception.py",
  "Pyjo/File.py",
  "Pyjo/Headers.py",
  "Pyjo/Home.py",
  "Pyjo/IOLoop/__init__.py",
  "Pyjo/IOLoop/Client.py",
  "Pyjo/IOLoop/Server.py",
  "Pyjo/IOLoop/Stream.py",
  "Pyjo/IOLoop/TLS.py",
  "Pyjo/JSON/__init__.py",
  "Pyjo/JSON/Pointer.py",
  "Pyjo/Loader.py",
  "Pyjo/Log.py",
  "Pyjo/Parameters.py",
  "Pyjo/Path.py",
  "Pyjo/Promise.py",
  "Pyjo/Prove.py",
  "Pyjo/Reactor/__init__.py",
  "Pyjo/Reactor/Asyncio.py",
  "Pyjo/Reactor/Poll.py",
  "Pyjo/String/Bytes.py",
  "Pyjo/String/Unicode.py",
  "Pyjo/Test.py",
  "Pyjo/URL.py",
]
