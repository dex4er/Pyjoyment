[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "Pyjoyment"
version = "0.0.2"
description = "A real-time web framework for the Python programming language, ported from Mojolicious."
readme = "README.md"
license = "Artistic-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Piotr Roszatycki", email = "piotr.roszatycki@gmail.com" }]
requires-python = ">=3.12"
dependencies = []
keywords = [
  "async",
  "framework",
  "html",
  "http",
  "mojo",
  "mojolicious",
  "pyjo",
  "pyjoyment",
  "tap",
  "test",
  "websocket",
  "wsgi",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Internet :: WWW/HTTP :: WSGI",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Server",
  "Topic :: Software Development :: Testing",
  "Topic :: Text Processing :: Markup :: HTML",
]

[project.scripts]
pyjo = "Pyjoyment.Commands:main"
pyjo-prove = "Pyjo.Prove:main"
pyjo-hot = "Pyjo.Server.Hot:main"
pyjo-reload = "Pyjo.Server.Reload:main"

# The plugin of pytest, which pytest loads only where it is installed
[project.entry-points.pytest11]
pyjo = "Pyjo.Test.pytest_plugin"

[project.urls]
Homepage = "https://github.com/dex4er/Pyjoyment"
Documentation = "https://pyjoyment.readthedocs.io/"
Source = "https://github.com/dex4er/Pyjoyment"
Issues = "https://github.com/dex4er/Pyjoyment/issues"

# Not dependencies of the package: the ASGI, WSGI and CGI servers that the tests in t/servers run Pyjo.Server.ASGI,
# Pyjo.Server.WSGI, Pyjo.Server.CGI and the examples on, and a client of WebSocket for them
[dependency-groups]
servers = [
  "daphne>=4.2.3",
  "granian>=2.8.4",
  "gunicorn>=26.2.0; sys_platform != 'win32'",
  "hypercorn>=0.18.0",
  "uwsgi>=2.0.30; sys_platform != 'win32'",
  "uvicorn>=0.54.0",
  "uvloop>=0.23.0; sys_platform != 'win32'",
  "waitress>=3.0.2",
  "websockets>=17.2",
  "werkzeug>=3.1.9",
]
# Not dependencies of the package: pytest, which the tests in t/Pyjo/Test_pytest_plugin.py run the plugin
# Pyjo.Test.pytest_plugin with, and pytest-xdist, which runs the test scripts at the same time
pytest = ["pytest>=9.1.1", "pytest-xdist>=3.8.0"]

# uWSGI runs CGI scripts with its plugin "cgi", which the package builds into the binary only on request
[tool.uv.extra-build-variables]
uwsgi = { UWSGI_EMBED_PLUGINS = "cgi" }

[tool.hatch.build.targets.wheel]
packages = ["Pyjo", "Pyjoyment"]

[tool.hatch.build.targets.sdist]
include = [
  "/Pyjo",
  "/Pyjoyment",
  "/t",
  "/tt",
  "/examples",
  "/docs",
  "/.proverc",
  "/LICENSE",
  "/README.md",
]

# pytest runs the test scripts with the plugin Pyjo.Test.pytest_plugin
[tool.pytest.ini_options]
testpaths = ["t"]

[tool.ruff]
line-length = 120
target-version = "py312"

# The tests of t-strings (PEP 750), which only Python 3.14 compiles; Pyjo.Prove
# skips them on an older Python, as their requires-python of PEP 723 says. The
# templates of files in tt/templates_native are rendered by such tests only.
[tool.ruff.per-file-target-version]
"t/Pyjo/String_Template_native.py" = "py314"
"t/docs/String_Template.py" = "py314"
"t/Pyjoyment/py_native_lite_app.py" = "py314"
"t/docs/Pyjoyment_Plugin_PyRenderer.py" = "py314"
"tt/templates_native/**" = "py314"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# An explicit list, because newer ruff enables many more rules by default,
# including N999, which rejects the Mojo-style module names on purpose.
select = ["B", "E4", "E7", "E9", "F", "I", "TID251", "UP"]
ignore = [
  # B018 "Found useless expression. Either assign it to a variable or remove
  # it.": reading an attribute for its side effect is intentional, to build a
  # lazy attribute or to raise ReferenceError for a dead weakref proxy.
  "B018",
  # E722 "Do not use bare `except`": ported from Perl's eval {}, which catches
  # everything; narrowing it to Exception changes behaviour.
  "E722",
  # E741 "Ambiguous variable name: `l`": names as in the Mojo code they were
  # ported from.
  "E741",
]

[tool.ruff.lint.per-file-ignores]
# Test scripts import all test functions, like `use Test::More` in Perl.
"t/**" = [
  # F403 "`from Pyjo.Test import *` used; unable to detect undefined names"
  "F403",
  # F405 "`ok` may be undefined, or defined from star imports"
  "F405",
  # TID251 "`asyncio` is banned: ...": the tests check how a reactor works
  # with asyncio.
  "TID251",
]
# TID251 "`asyncio` is banned: ...": the reactor is the one that uses the
# event loop, the test harness runs the scripts with asyncio, and the examples
# and the benchmarks are the code of a user.
"Pyjo/Reactor/**" = ["TID251"]
"Pyjo/Prove.py" = ["TID251"]
"Pyjo/Test/pytest_plugin.py" = ["TID251"]
"benchmarks/**" = ["TID251"]
"examples/**" = [
  "TID251",
  # F403 "`from Pyjoyment.Lite import *` used; unable to detect undefined
  # names": a script of Pyjoyment.Lite imports its functions, like `use
  # Mojolicious::Lite` in Perl.
  "F403",
  # F405 "`get` may be undefined, or defined from star imports"
  "F405",
]
# The examples of the guides are scripts of Pyjoyment.Lite too.
"docs/guides/**" = [
  # TID251 "`asyncio` is banned: ...": an example is the code of a user, as
  # the ones of examples/.
  "TID251",
  # F403 "`from Pyjoyment.Lite import *` used; unable to detect undefined
  # names"
  "F403",
  # F405 "`get` may be undefined, or defined from star imports"
  "F405",
]
# E402 "Module level import not at top of file": the namespace of the package is
# open before it imports its subpackages, which extend it with their parts.
"Pyjoyment/__init__.py" = ["E402"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Only a reactor uses the event loop, so that another reactor can replace it.
"asyncio".msg = "only a reactor uses the event loop, use the methods of Pyjo.Reactor"


[tool.ruff.lint.isort]
# Pyjo modules first, then the standard library, like Mojo modules list Mojo::*
# before core modules; `import X` and `from X import y` in separate groups.
known-first-party = ["Pyjo", "Pyjoyment"]
section-order = [
  "future",
  "first-party",
  "local-folder",
  "standard-library",
  "third-party",
]
lines-between-types = 1
lines-after-imports = 2

[tool.pyright]
pythonVersion = "3.12"
# The tests of t-strings, as in per-file-target-version of ruff
executionEnvironments = [
  { root = "t/Pyjo/String_Template_native.py", pythonVersion = "3.14", extraPaths = [
    ".",
  ] },
  { root = "t/docs/String_Template.py", pythonVersion = "3.14", extraPaths = [
    ".",
  ] },
  { root = "t/Pyjoyment/py_native_lite_app.py", pythonVersion = "3.14", extraPaths = [
    ".",
  ] },
  { root = "t/docs/Pyjoyment_Plugin_PyRenderer.py", pythonVersion = "3.14", extraPaths = [
    ".",
  ] },
  { root = "tt/templates_native", pythonVersion = "3.14", extraPaths = [
    ".",
  ] },
  # The stages of the guide Growing, which import the model of its final application
  { root = "docs/guides/growing", extraPaths = [
    ".",
    "docs/guides/growing/login",
  ] },
  { root = "." },
]
